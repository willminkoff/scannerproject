display_information:
  name: MCP
  description: Private Slack DM bridge for MCP task notifications and replies.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: MCP
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - incoming-webhook
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
