<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScannerCtl</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>ScannerCtl</h1>
    <button id="theme" class="ghost" title="theme">◐</button>
  </header>

  <main>
    <!-- Analog (SDRangel) -->
    <section class="card" id="analog">
      <div class="card-h"><h2>Airband / Ground</h2><span class="dot" id="analog-dot"></span></div>
      <div class="row">
        <button class="primary" data-act="scan-start">Scan ▶</button>
        <button data-act="scan-stop">Stop ◼</button>
      </div>
      <label class="sq">Squelch <output id="sq-val">-55</output> dBFS
        <input type="range" id="sq" min="-100" max="-30" value="-55" step="1">
      </label>
      <pre class="mini" id="analog-info">…</pre>
    </section>

    <!-- Digital (SDRTrunk) -->
    <section class="card" id="digital">
      <div class="card-h"><h2>Digital P25</h2><span class="dot" id="digital-dot"></span></div>
      <div class="row">
        <button data-act="digital-restart">Reload playlist ⟳</button>
      </div>
      <pre class="mini" id="digital-info">…</pre>
    </section>
  </main>

  <footer><small>analog = SDRangel REST · digital = SDRTrunk · also drivable via Claude</small></footer>

  <script>
  const $ = s => document.querySelector(s);
  async function api(path, opts){ const r = await fetch(path, opts); return r.json().catch(()=>({})); }
  function dot(el, ok){ el.className = "dot " + (ok ? "ok" : "bad"); }

  async function refresh(){
    const s = await api("/api/status");
    dot($("#analog-dot"), s.analog?.ok);
    dot($("#digital-dot"), s.digital?.ok);
    $("#analog-info").textContent = JSON.stringify(s.analog?.summary ?? s.analog, null, 1).slice(0, 600);
    $("#digital-info").textContent = (s.digital?.recent ?? []).join("\n") || "(no recent activity)";
  }
  document.body.addEventListener("click", async e => {
    const a = e.target.dataset.act; if(!a) return;
    if(a==="scan-start") await api("/api/scan/start", {method:"POST"});
    if(a==="scan-stop")  await api("/api/scan/stop",  {method:"POST"});
    if(a==="digital-restart") await api("/api/digital/restart", {method:"POST"});
    refresh();
  });
  $("#sq").addEventListener("input", e => $("#sq-val").textContent = e.target.value);
  $("#sq").addEventListener("change", e =>
    api("/api/squelch", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({dbfs: +e.target.value, deviceset:0, channel:0})}));
  $("#theme").addEventListener("click", () => {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  });
  refresh(); setInterval(refresh, 5000);
  </script>
</body>
</html>
