<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScannerCtl</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>ScannerCtl</h1>
    <span id="clock" class="muted"></span>
    <button id="theme" class="ghost" title="theme">◐</button>
  </header>

  <main>
    <!-- FLEET — single-consumer switch (via sdrctl) -->
    <section class="card span" id="fleet">
      <div class="card-h">
        <h2>Fleet <span class="dot" id="api-dot" title="SDRplay apiService"></span></h2>
        <span class="muted" id="fleet-state">…</span>
      </div>
      <div class="row">
        <button data-act="start-sdrangel">📻 Analog</button>
        <button data-act="start-sdrtrunk">📡 Digital</button>
        <button class="warn" data-act="stop-all">Stop</button>
      </div>
      <p class="muted hint" id="fleet-hint">One backend at a time — switching takes ~20–30s.</p>
    </section>

    <!-- ANALOG (SDRangel) -->
    <section class="card" id="analog">
      <div class="card-h"><h2>Airband / Ground</h2><span class="dot" id="analog-dot"></span></div>
      <div class="row">
        <button class="primary" data-act="scan-start">Scan ▶</button>
        <button data-act="scan-stop">Stop ◼</button>
      </div>
      <label class="sq">Squelch <output id="sq-val">-55</output> dBFS
        <input type="range" id="sq" min="-100" max="-30" value="-55" step="1">
      </label>
      <div id="analog-info" class="info">…</div>
    </section>

    <!-- DIGITAL (SDRTrunk) -->
    <section class="card" id="digital">
      <div class="card-h"><h2>Digital P25</h2><span class="dot" id="digital-dot"></span></div>
      <div id="sys-line" class="sys muted">…</div>
      <div class="row">
        <button data-act="digital-restart">Reload playlist ⟳</button>
      </div>
      <div id="calls" class="calls"><div class="muted">…</div></div>
    </section>
  </main>

  <footer><small>analog = SDRangel REST · digital = SDRTrunk decode · switch via sdrctl · also drivable via Claude</small></footer>

  <script>
  const $ = s => document.querySelector(s);
  const api = (p, o) => fetch(p, o).then(r => r.json()).catch(() => ({}));
  const dot = (el, ok) => el.className = "dot " + (ok === null ? "" : ok ? "ok" : "bad");
  const esc = s => (s ?? "").toString().replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  function setActive(f){
    // dim a backend card only if that backend is NOT running (so coexistence shows both lit)
    $("#analog").classList.toggle("dim", !f.sdrangel);
    $("#digital").classList.toggle("dim", !f.sdrtrunk);
  }

  function renderCalls(d){
    const sys = d.system || {}, cc = d.cc || {};
    $("#sys-line").innerHTML = sys.nac
      ? `NAC <b>x${esc(sys.nac)}</b>${sys.site ? ` · RFSS ${esc(sys.rfss)}/SITE ${esc(sys.site)}`:""}`
        + (cc.lines ? ` · CC ${cc.valid}/${cc.lines} ok, ${cc.grants} grants, ${cc.sync_loss_pct}% sync-loss` : "")
      : "(no control channel decoded yet)";
    const calls = d.calls || [];
    $("#calls").innerHTML = calls.length ? calls.map(c => {
      const who = c.alias ? `<b>${esc(c.alias)}</b>` : `TG ${esc(c.tg ?? "?")}`;
      const freq = c.followed ? `<span class="freq">${c.freq.toFixed(4)}</span>` : `<span class="muted">grant</span>`;
      const badge = c.enc ? `<span class="badge enc">ENC</span>` : `<span class="badge clr">clear</span>`;
      return `<div class="call ${c.enc?'is-enc':''}"><span class="t">${esc(c.time)}</span>`
           + `<span class="tg">${who}</span>${badge}${freq}</div>`;
    }).join("") : `<div class="muted">(no calls in the recent window)</div>`;
  }

  async function refresh(){
    const s = await api("/api/status");
    const f = s.fleet || {};
    dot($("#api-dot"), f.apiservice);
    $("#fleet-state").textContent = f.conflict ? "⚠ apiService contention"
      : f.coexist ? "analog + digital"
      : f.active === "sdrangel" ? "active: SDRangel"
      : f.active === "sdrtrunk" ? "active: SDRTrunk" : "all stopped";
    setActive(f);
    // analog
    dot($("#analog-dot"), s.analog ? s.analog.ok : null);
    if(s.analog?.ok){
      $("#analog-info").innerHTML = (s.analog.sets || []).map(d => {
        const st = d.state==="running" ? `<span class="badge clr">run</span>` :
                   d.state ? `<span class="badge">${esc(d.state)}</span>` : "";
        return `<div class="dev"><b>${esc(d.hw)}</b>${st}${d.center_mhz?` · ${d.center_mhz} MHz`:""}`
        + ` · <span class="muted">${esc((d.channels||[]).join(", ")) || d.nchan+" ch"}</span></div>`;
      }).join("") || "(no device sets)";
    } else {
      $("#analog-info").innerHTML = `<span class="muted">${f.sdrangel ? "(SDRangel REST not responding)" : "(not running — tap Analog)"}</span>`;
    }
    // digital
    dot($("#digital-dot"), s.digital ? s.digital.ok : null);
    if(s.digital) renderCalls(s.digital);
    else $("#calls").innerHTML = `<div class="muted">${f.sdrtrunk ? "(starting…)" : "(not running — tap Digital)"}</div>`;
  }

  document.body.addEventListener("click", async e => {
    const a = e.target.dataset.act; if(!a) return;
    e.target.classList.add("busy");
    const map = {
      "start-sdrangel": ["/api/fleet/start/sdrangel"], "start-sdrtrunk": ["/api/fleet/start/sdrtrunk"],
      "stop-all": ["/api/fleet/stop/all"],
      "scan-start": ["/api/scan/start"], "scan-stop": ["/api/scan/stop"],
      "digital-restart": ["/api/digital/restart"],
    };
    if(map[a]) await api(map[a][0], {method:"POST"});
    setTimeout(() => { e.target.classList.remove("busy"); refresh(); }, 800);
  });
  $("#sq").addEventListener("input", e => $("#sq-val").textContent = e.target.value);
  $("#sq").addEventListener("change", e =>
    api("/api/squelch", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({dbfs:+e.target.value, deviceset:0, channel:0})}));
  $("#theme").addEventListener("click", () => {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
  });
  setInterval(() => $("#clock").textContent = new Date().toLocaleTimeString(), 1000);
  refresh(); setInterval(refresh, 4000);
  </script>
</body>
</html>
