# Drop-in: enable audio-path tracing on airband.
#
# Added 2026-06-11 to investigate the silent-audio-while-hits-fire bug.
# Causes hit_detector to emit an `audio_path_state` event each tick (5 Hz)
# and populate the `audio_path` block in `get_status` responses.
#
# Field meanings (see chirp/hit_detector.py):
#   tick_lag_ms      time since prior tick.  Should be ~200ms with default
#                    poll_s=0.2.  >500ms = Python thread starvation.
#   open_count       live channels with squelch open this tick.
#   muted_count      live channels with priority_muted=True.
#   parked_count     channels skipped because LO scheduler has them parked.
#   live_count       claimed channels not parked this tick.
#   selected_id      priority gate selection (None if no opens).
#   audio_path_health
#       "live"       at least one open + unmuted live channel — audio
#                    should flow.
#       "all_muted"  every live channel is priority-muted but at least
#                    one is squelch-open.  THIS IS THE BUG SIGNATURE.
#       "no_open"    live but nothing keying.  Expected quiet.
#       "no_live"    every claimed channel is parked.  Cold start or
#                    plan_failed degraded state.
#
# Run `python3 scripts/chirp-audio-path-probe.py --port 7400 --interval 0.5`
# to watch the snapshot live.
#
# Cost: a handful of ints per tick, plus one UDP event per tick when trace
# is on.  Safe to leave on in production.
#
# Remove this file once the bug is fixed and we don't need the audio_path
# stream anymore.

[Service]
Environment="CHIRP_AUDIO_TRACE=1"
