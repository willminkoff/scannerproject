# Drop-in: airband LO scheduler cluster cap.
#
# Without this, DEFAULT_MAX_CLUSTERS=3 in chirp/dsp/lo_scheduler.py limits
# the LO planner to 3 clusters. With ~16 channels spread across 118-137 MHz
# (~19 MHz span) and source_samp_rate=2 MHz, the planner needs 6+ clusters
# to cover all channels.  Channels outside the planned clusters get parked
# by set_parked() (chirp/dsp/channel.py:333-358), which slams squelch to 0.0
# → the channel is permanently silent, regardless of squelch/VAD settings.
#
# Symptom: hit_start/hit_end events fire normally in the daemon journal
# (real ATC voice at -50 to -30 dBFS) but the /ANALOG.mp3 mount reads -91 dB.
# Daemon CPU pegs at 800-1000% because the LO scheduler thrashes trying to
# revisit clusters within the cap.
#
# Ground had the same bug; resolved by the analogous CHIRP_LO_MAX_CLUSTERS=16
# drop-in (chirp/systemd/gr-demod@ground.service.d/ — installed 2026-06-10).
# Airband never got the parallel fix until now (2026-06-11).
#
# Why 16: covers typical regional profiles (12-16 ATC + ZDC RCAG channels
# across ~25 MHz) with headroom. Larger values are fine but burn a few
# percent more CPU on the LO planner.
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/gr-demod@airband.service.d
#   sudo cp chirp/systemd/gr-demod@airband.service.d/02-lo-clusters.conf \
#           /etc/systemd/system/gr-demod@airband.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart gr-demod@airband.service

[Service]
Environment="CHIRP_LO_MAX_CLUSTERS=16"
