# Drop-in: disable priority gate on airband
#
# The priority gate routes only ONE channel's audio at a time (most-recent-
# opened latch). Under high cluster-hop activity (which happens whenever the
# scan list spans more than ~2 MHz at 2 Msps source rate), the gate can latch
# on a parked or transient channel and never release, producing -91 dB silence
# at the icecast mount while the journal still shows hit_start/hit_end events
# firing for OTHER channels.
#
# Observed 2026-06-11 across multiple test sessions: airband daemon at 800-
# 1200% CPU + hits firing + ANALOG.mp3 at -91 dB.  Ground daemon, which never
# had priority_gate_enabled set, never exhibited this pattern.  Disabling the
# gate on airband returns ANALOG.mp3 to normal voice level.
#
# Tradeoff: when two ATC channels are simultaneously active, both are mixed
# instead of one taking precedence.  In practice this is OK because ATC has
# very few concurrent transmissions on the same scan list.
#
# Filename sorts AFTER cutover.conf so this override actually applies.

[Service]
Environment="CHIRP_PRIORITY_GATE_ENABLED=0"
