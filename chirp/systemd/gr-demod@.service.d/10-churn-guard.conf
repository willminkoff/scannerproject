# Churn guard for the chirp dual-tuner daemons (gr-demod@airband / gr-demod@ground).
#
# When a tuner cannot attach to the shared sdrplay_apiService — classically the
# ground SLAVE hanging in sdrplay_api_Open() ~59s after the MASTER restarts —
# systemd's default auto-restart hammers the apiService with repeated hung opens.
# That churn is what wedges the apiService for ALL clients (airband AND op25),
# i.e. it turns one tuner's hiccup into a whole-stack outage.
#
# This caps restarts to 3 per 10 minutes, then lets the unit settle into 'failed'
# instead of looping forever. A wedge is then recovered deliberately and cleanly:
#     sudo /usr/local/bin/recover-sdrplay.sh
#
# Deploy to:  /etc/systemd/system/gr-demod@.service.d/10-churn-guard.conf
# then:       sudo systemctl daemon-reload
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
# Space out restart attempts instead of hammering, and bound a hung
# sdrplay_api_Open() so a wedge is detected in ~40s rather than ~60s.
# (A healthy master/slave open streams in 2-3s, so this only catches hangs.)
RestartSec=15
TimeoutStartSec=40
