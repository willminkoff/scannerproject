# Drop-in: order ground (RSPduo slave) after airband (RSPduo master).
#
# Without this, `systemctl restart gr-demod@airband.service
# gr-demod@ground.service` races: ground (slave) hits sdrplay_api_Open
# before airband (master) has completed its open + master/slave
# handshake, and sdrplay returns
#   RuntimeError: sdrplay RSPduo slave mode not available
# Ground exits, systemd retries (RestartSec=2), sometimes recovers,
# sometimes both bands wedge.
#
# After= is ordering ONLY — NOT Requires/Wants. Single-band ground
# operation (airband intentionally down) remains supported; After= of
# a stopped unit is a no-op per systemd.unit(5).
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/gr-demod@ground.service.d
#   sudo cp chirp/systemd/gr-demod@ground.service.d/01-after-airband.conf \
#           /etc/systemd/system/gr-demod@ground.service.d/
#   sudo systemctl daemon-reload

[Unit]
After=gr-demod@airband.service
