# Multi-instance OP25 (one process per tuner). Required so the
# allocator can hand out RSPduo Tuner 2 alongside Tuner 1 when the
# scan pool has 2+ digital systems active.  Each instance runs under
# scanner-digital-op25@<idx>.service.
OP25_RSPDUO_SPLIT_PROCESSES=1

# RSPduo dedicated to rtl-airband (DT mode, both tuners).  The OP25
# dongle allocator filters this serial out of the digital tuner pool
# so it can't accidentally claim a tuner that rtl-airband is using.
RTL_AIRBAND_RSPDUO_SERIAL=1809063632
OP25_DEFAULT_OFFSET=0
