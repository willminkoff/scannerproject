# Source-side BOOM feed cap (volume-equalization, 2026-06-26): cvlc --gain 0.3
# = 30% output at the VLC source. Durable + reconnect-proof (unlike a pactl
# sink-input set). BOOM's own volume is NOT touched. Reversible: remove this file.
[Service]
ExecStart=
ExecStart=/usr/bin/cvlc --intf dummy --aout=pulse --gain 0.3 --quiet --no-video --clock-jitter=0 --clock-synchro=0 --http-reconnect --network-caching 150 --live-caching 100 http://127.0.0.1:8000/VFO.mp3
