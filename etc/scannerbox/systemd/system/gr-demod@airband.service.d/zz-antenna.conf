# 2026-06-12: explicitly select the 50-ohm tuner-1 port on the RSPduo.
# Discone is on tuners 1+2 of both RSPduos via splitter.  SoapySDRPlay3's
# listAntennas() returns: ('Tuner 1 50 ohm', 'Tuner 1 Hi-Z', 'Tuner 2 50 ohm').
# Without an explicit antenna selection, the driver's default isn't always
# the 50 ohm port — and "Antenna A" (which we tried first) isn't a valid
# name, so set_antenna() silently failed and we got default.

[Service]
Environment="CHIRP_SDR_ANTENNA=Tuner 1 50 ohm"
