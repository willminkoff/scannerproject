# Drop-in: order OP25 strictly AFTER both chirp daemons are ready.
#
# Without this, scanner-digital-op25 can start (or auto-restart via
# RestartSec=15) concurrently with gr-demod@airband/@ground, and the three
# processes race on sdrplay_apiService.  Per chirp/dsp/source_sdr.py:30-37
# and scripts/ensure-op25-runtime.py:98-117, sdrplay_apiService does NOT
# safely serialize concurrent `sdrplay_api_Open` calls — even when the
# calls target DIFFERENT physical RSPduos.  Concurrent opens either
# deadlock or return spurious
#   RuntimeError: sdrplay RSPduo mode not available
# to whichever chirp daemon happens to perform any sdrplay_api IPC during
# the window.  Recovery typically requires `sudo systemctl restart sdrplay`
# (and sometimes a USB unbind/rebind).
#
# Both chirp daemons are Type=notify, so After= waits for their READY=1
# (flowgraph init + cmd server + state restore all succeed), not just the
# moment they exec.  By the time OP25 launches, sdrplay_apiService has
# stable handles for serial 1809063632 (MA + SL) and is ready to accept
# the ST open for serial 180903EF32.
#
# After= is ordering ONLY — NOT Requires/Wants.  If chirp@airband is
# intentionally disabled, After= of a stopped unit is a no-op per
# systemd.unit(5), and OP25 still starts.
#
# Deploy:
#   sudo mkdir -p /etc/systemd/system/scanner-digital-op25.service.d
#   sudo cp systemd/scanner-digital-op25.service.d/10-after-chirp.conf \
#           /etc/systemd/system/scanner-digital-op25.service.d/
#   sudo systemctl daemon-reload

[Unit]
After=gr-demod@airband.service gr-demod@ground.service
