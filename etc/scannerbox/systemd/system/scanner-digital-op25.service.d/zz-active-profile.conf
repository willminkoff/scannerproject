[Service]
# Boot-safe: force the active digital profile before op25 resolves it.
# Something reset /etc/.../active -> example at boot (writer unconfirmed);
# this guarantees op25 always loads nashville_curated. Clears+re-orders
# ExecStartPre so the symlink fix runs BEFORE ensure-op25-runtime.py.
ExecStartPre=
ExecStartPre=+/bin/ln -sfn /etc/scannerproject/digital/profiles/nashville_curated /etc/scannerproject/digital/active
ExecStartPre=/usr/bin/python3 /home/ubuntu/scannerproject/scripts/ensure-op25-runtime.py
