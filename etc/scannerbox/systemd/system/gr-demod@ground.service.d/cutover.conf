[Service]
# Phase 4d production cutover — publishing to /ANALOG_GROUND.mp3.
# CHIRP_ALLOW_PROD_MOUNT lifts the Phase 3 mount-name guard.
Environment="CHIRP_AUDIO_OUT=icecast:127.0.0.1:8000:/ANALOG_GROUND.mp3:__ICECAST_SOURCE_PW__"
Environment="CHIRP_ALLOW_PROD_MOUNT=1"
Environment="CHIRP_SOURCE=sdr"
WorkingDirectory=/home/ubuntu/scannerproject
Environment="PYTHONPATH=/home/ubuntu/scannerproject"
Environment="CHIRP_LO_MAX_CLUSTERS=8"
