[Service]
# Widen stop timeout from the unit's hardcoded 1s.  SDRplay master-mode
# cleanup reliably takes longer than 1 second; the short timeout caused
# systemd to escalate to SIGKILL on the master tuner handle, which is
# the condition that occasionally wedges the SDRplay API daemon in
# deactivating (stop-sigterm).  See Fix 4 in the project docs.
TimeoutStopSec=5
