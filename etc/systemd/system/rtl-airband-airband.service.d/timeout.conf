[Service]
# Widen stop timeout from the unit's hardcoded 1s.  SDRplay master-mode
# cleanup reliably takes longer than the prior 5s value: the journal
# showed every restart hitting stop-sigterm → SIGKILL at the 5s mark,
# which is the exact escalation that wedges the SDRplay API daemon on
# the master tuner handle and forces a full Micro reboot to recover.
#
# 30s gives sdrplay_api_Close room to tear down the streamHandler /
# eventHandler / heartBeat threads without escalation, while staying
# well under systemd's 90s DefaultTimeoutStopSec.  See backend audit
# 2026-06-03 (ANALOG.mp3 mount dark after morning restart cascade).
TimeoutStopSec=30
