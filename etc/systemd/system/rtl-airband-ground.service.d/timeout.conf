[Service]
# Widen stop timeout from the unit's hardcoded 1s.  See airband sibling
# drop-in for rationale.  Slave-mode cleanup hits the same SDRplay
# teardown path; the prior 5s value was insufficient and produced the
# same stop-sigterm → SIGKILL pattern (every restart today, verified
# via journalctl).  30s matches the airband sibling.
TimeoutStopSec=30
