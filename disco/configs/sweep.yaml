classifier:
  confidence_threshold: 0.7
  max_buffered_slices: 1000
  poll_interval_ms: 250
  slice_min_snr_db: 18.0
  slice_samples: 2048
  slices_per_step_max: 1
  slice_target_rate_floor_hz: 50000
dashboard:
  host: 0.0.0.0
  port: 8092
db:
  path: /home/ubuntu/scannerproject/disco/state/disco.sqlite
  retention_hours: 24
detection:
  min_bandwidth_hz: 5000
  noise_floor_percentile: 30
  threshold_above_floor_db: 12
sweep:
  dwell_ms: 400
  fft_size: 16384
  sample_rate_hz: 2000000
  step_factor: 0.85
  tune_settle_ms: 80
tuners:
  A-T1:
    band_end_hz: 300000000
    band_start_hz: 100000000
    soapy_args: driver=sdrplay,serial=1809063632,mode=MA
  A-T2:
    band_end_hz: 500000000
    band_start_hz: 300000000
    soapy_args: driver=sdrplay,serial=1809063632,mode=SL
  B-T1:
    band_end_hz: 750000000
    band_start_hz: 500000000
    soapy_args: driver=sdrplay,serial=180903EF32,mode=MA
  B-T2:
    band_end_hz: 1000000000
    band_start_hz: 750000000
    soapy_args: driver=sdrplay,serial=180903EF32,mode=SL
interpret:
  poll_interval_s: 10
  rate_per_min: 10
  daily_budget_usd: 5.0
  cost_per_call_cents: 0.5
  cache_ttl_s: 86400
  model: claude-sonnet-4-6
  min_confidence: 0.6
  dedupe_bin_khz: 25.0
  max_per_cycle: 5
