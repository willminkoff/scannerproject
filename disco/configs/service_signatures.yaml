# Disco — service signature catalog.
#
# Each entry describes a wireless service Disco can identify by combining
# frequency range with spectral / temporal features. The fingerprinter
# (disco/src/fingerprint.py) scores entries that bracket the detection
# frequency and returns the best fit above min_confidence.
#
# Field meanings:
#   name                    Human-readable label rendered in the dashboard
#                           and in Claude prompts (when fingerprint hit
#                           drives high-tier identification).
#   freq_min_hz/freq_max_hz Inclusive frequency range where this signature
#                           is plausible. Required.
#   bandwidth_3db_hz_min/max Expected 3 dB bandwidth bracket. Soft fade
#                           outside the range — score decays linearly to 0
#                           at 2× spread.
#   shape                   One of: narrow_carrier, wide_flat,
#                           ofdm_multicarrier, fsk_two_tone,
#                           broadband_noise, unknown.
#                           See fingerprint._classify_shape() for the
#                           classification rules.
#   duty_cycle              One of: continuous, bursty, hopping, unknown.
#                           "hopping" entries can't be confirmed from a
#                           single slice today — the matcher treats them
#                           as soft hints rather than strict.
#   confidence_weight       Operator hint [0.0, 1.0]. Lower = "this entry
#                           is generic, prefer a more specific match if
#                           one exists." Default 1.0.
#   allowed_bands           Optional list of band-plan band names where
#                           this signature is permitted. If set, the
#                           entry is REJECTED when the detection's band
#                           is not in the list (or unknown). Prevents
#                           catch-all entries from over-firing in bands
#                           that physically can't host the service.
#   forbidden_bands         Optional denylist. Same semantics as
#                           allowed_bands but inverted — entry is
#                           rejected when band IS in the list. Use when
#                           it's easier to enumerate exclusions.
#   notes                   Free-form documentation for the next person.
#
# Coverage today (MVP): WiFi, broadcast, NOAA, P25 control, GMRS/FRS,
# marine VHF, aircraft AM, LoRa, ISM 433/915, garage door, paging,
# wireless mics, ATSC TV. Extending the catalog is YAML-only — no code
# changes needed. New entries go through PR review.

signatures:

  # ============================================================
  # Aviation VHF — 118–137 MHz AM voice
  # ============================================================
  - name: "Aircraft VHF AM (25 kHz channel)"
    freq_min_hz: 118000000
    freq_max_hz: 137000000
    bandwidth_3db_hz_min: 6000
    bandwidth_3db_hz_max: 12000
    shape: narrow_carrier
    duty_cycle: bursty
    confidence_weight: 0.9
    allowed_bands:
      - AVIATION_VOICE
    notes: "Air-band voice. 8.33 kHz variants exist in Europe; US still mostly 25 kHz."

