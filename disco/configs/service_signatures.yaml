    shape: narrow_carrier
    duty_cycle: continuous
    confidence_weight: 1.0
    allowed_bands:
      - NOAA_WX
    notes: "Channels at 162.400, 162.425, 162.450, 162.475, 162.500, 162.525, 162.550 MHz. NWS broadcasts continuously."

