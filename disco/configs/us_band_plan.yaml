# FCC Table of Frequency Allocations — disco Phase 4 Layer 1.
#
# Source:      47 CFR § 2.106 (FCC Online Table of Frequency Allocations)
# Source URL:  https://www.fcc.gov/engineering-technology/policy-and-rules-division/general/radio-spectrum-allocation
# PDF:         https://www.fcc.gov/file/14014/download
# Retrieved:   2026-05-13 (by scope/lookup at disco Phase 4 design time)
# Pinned rev:  Verify the table cover date on next refresh and update this line.
#
# Each band entry constrains which v3 model classes are physically plausible in
# that frequency range. Predictions outside `allowed_modes` are downgraded by
# the Layer 2 classifier integration (band_plan.tag_for) to:
#   "<BAND_NAME> — unidentified (model said: <ml_class>)"
#
# Coverage: 30 MHz – 1.3 GHz contiguous, plus ISM 2.4 GHz.
# Out of scope: HF (<30 MHz, hardware can't tune), microwave above 2.5 GHz
# except ISM 2.4. Gaps in the table mean "permissive default" — return the
# unmodified ML class without a band tag.
#
# v3 class list (from disco/models/radioml.classes.json — keep in sync):
#   NOISE FM_BROADCAST FM_NARROW AM_VOICE DMR GMSK QPSK OQPSK QAM OOK
#   CELLULAR LTE P25 NXDN POCSAG
#
# To add a band: append entry with name (UPPER_SNAKE), freq_min_hz/freq_max_hz
# (underscored ints), allowed_modes (subset of the v3 list), notes (rationale).
# Order: narrower / more specific bands first; first frequency match wins.
# The current table has no overlaps, but the lookup tolerates them.

bands:
  # --- Low VHF (30-88 MHz) -------------------------------------------------
  - name: LO_VHF
    freq_min_hz: 30_000_000
    freq_max_hz: 50_000_000
    allowed_modes: [FM_NARROW, AM_VOICE, POCSAG]
    notes: "Low VHF — government, business, historical paging, occasional CB"

  - name: AMATEUR_6M
    freq_min_hz: 50_000_000
    freq_max_hz: 54_000_000
    allowed_modes: [FM_NARROW, AM_VOICE]
    notes: "6m amateur — FM repeaters, AM, SSB (SSB not in v3)"

  - name: TV_VHF_LOW
    freq_min_hz: 54_000_000
    freq_max_hz: 88_000_000
    allowed_modes: [QAM, FM_NARROW]
    notes: "TV channels 2-6 — ATSC 8VSB (closest v3 = QAM); audio subcarriers FM"

  # --- Broadcast FM (88-108 MHz) -------------------------------------------
  - name: BCAST_FM
    freq_min_hz: 88_000_000
    freq_max_hz: 108_000_000
    allowed_modes: [FM_BROADCAST]
    notes: "FCC commercial FM broadcast, 200 kHz channels"

  # --- Aviation (108-137 MHz) ----------------------------------------------
  - name: AVIATION_NAV
    freq_min_hz: 108_000_000
    freq_max_hz: 117_975_000
    allowed_modes: [AM_VOICE]
    notes: "VOR/ILS localizer — AM only. NXDN/P25/digital here is impossible by allocation; this is the bug class Phase 4 catches."

  - name: AVIATION_VOICE
    freq_min_hz: 118_000_000
    freq_max_hz: 136_975_000
    allowed_modes: [AM_VOICE]
    notes: "Airband ATC voice — AM, 8.33/25 kHz channels"

