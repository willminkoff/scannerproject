# Per-instance drop-in for the SLAVE tuner of RSPduo A. Without this, systemd
# starts A-T1 (Master, mode=MA) and A-T2 (Slave, mode=SL) concurrently, and
# the SDRplay user-space daemon deadlocks when both processes call
# sdrplay_api_Open against the same physical device at the same time. After=
# guarantees systemd waits for A-T1's start to be issued before A-T2's, and
# the ExecStartPre sleep gives the master ~2 s to fully attach (open +
# stream activated) before the slave's open arrives at the daemon.
[Unit]
After=disco-sweep@A-T1.service
# BindsTo stops T2 when T1 stops (releases slave handle so T1's master can
# re-open on Restart=on-failure). PartOf propagates T1's restart to T2 so
# the master/slave pair recovers atomically as a single transaction.
BindsTo=disco-sweep@A-T1.service
PartOf=disco-sweep@A-T1.service

[Service]
ExecStartPre=/bin/sleep 2
# Override template's Restart=on-failure → Restart=always so T2 retries
# after BindsTo's clean stop. PartOf propagates T1's explicit restart but
# NOT its Restart=on-failure auto-restart — empirical from Phase 5.5
# stress test. Restart=always closes the gap: T2 retries every RestartSec
# while T1 is recovering, succeeds once T1 is active.
Restart=always
RestartSec=5
