# Per-instance drop-in for the SLAVE tuner of RSPduo A. Without this, systemd
# starts A-T1 (Master, mode=MA) and A-T2 (Slave, mode=SL) concurrently, and
# the SDRplay user-space daemon deadlocks when both processes call
# sdrplay_api_Open against the same physical device at the same time. After=
# guarantees systemd waits for A-T1's start to be issued before A-T2's, and
# the ExecStartPre sleep gives the master ~2 s to fully attach (open +
# stream activated) before the slave's open arrives at the daemon.
[Unit]
After=disco-sweep@A-T1.service

[Service]
ExecStartPre=/bin/sleep 2
