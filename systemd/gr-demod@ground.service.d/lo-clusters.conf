[Service]
# Phase C #2 follow-up 2026-06-10: ground has 40 channels spanning 138-385
# MHz.  Default CHIRP_LO_MAX_CLUSTERS=8 can't fit them (cluster planner needs
# 13 windows at iq_bw_hz=2 MHz, falls through to scheduler_plan_failed and
# the daemon scans nothing).  Bump to 16 so the full channel list scans.
Environment="CHIRP_LO_MAX_CLUSTERS=16"
