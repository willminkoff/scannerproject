# 2026-06-13: RSPduo airband front-end gain. COUNTERINTUITIVE FINDING —
# airband was OVERLOADED, not gain-starved. Unfiltered AM airband + high
# front-end gain desensitizes the receiver (IF saturation, AGC clamps the
# desired signal). Empirical sweep at midday with live BNA traffic:
#   gain 48   -> 0 hits / totally deaf (overload)
#   gain 32.8 -> signals -74/-76 dBFS, ~2 hits/min, 1 dB squelch margin
#   gain 20   -> signals -63/-67 dBFS, ~6 hits/min, 8-12 dB margin (clean)
# LESS gain = stronger, cleaner signals. 15-25 likely the sweet spot;
# lo-clusters comment cites ideal ATC at -50/-30, so even lower MAY help.
[Service]
Environment="CHIRP_SDR_GAIN_DB=20"
