# Per-instance drop-in for the SLAVE tuner of RSPduo B. Same reasoning as
# the A-T2 drop-in: serializes Master/Slave open against the SDRplay daemon
# so concurrent sdrplay_api_Open calls don't deadlock.
[Unit]
After=disco-sweep@B-T1.service
# BindsTo + PartOf coupling — see A-T2 drop-in for full rationale.
BindsTo=disco-sweep@B-T1.service
PartOf=disco-sweep@B-T1.service

[Service]
ExecStartPre=/bin/sleep 2
# Restart=always override — see A-T2 drop-in for rationale.
Restart=always
RestartSec=5
