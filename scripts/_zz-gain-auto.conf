# 2026-06-12: Try the SDRplay hardware AGC on airband.
# Validates whether the 30-dB-below-expected signal level is a chirp
# gain-staging issue vs. an actual upstream RF deficit.  If AGC lifts
# the channel level into squelch-open territory, gain is the problem.
# Manual fixed gain at the daemon default (~32 dB) may be too low for
# our signal level; AGC will hunt for a better operating point.

[Service]
Environment="CHIRP_SDR_GAIN_MODE_AUTO=true"
